name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0 ndk;27.1.12297006'

      - name: Set NDK environment
        run: |
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/*/ | head -1)
          echo "NDK_HOME=${NDK_PATH%/}" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=${NDK_PATH%/}" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=${NDK_PATH%/}" >> $GITHUB_ENV

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install dependencies
        run: npm ci

      - name: Init Tauri Android
        run: npx tauri android init

      - name: Restrict ABI to arm64-v8a only
        run: python3 scripts/configure-android.py

      - name: Build APK (release, arm64 only)
        run: npx tauri android build --apk -t aarch64

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pdx-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          retention-days: 30
